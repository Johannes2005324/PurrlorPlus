org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8
android.useAndroidX=true
android.nonTransitiveRClass=true

# The Purrlor server this app opens, and its package name. A deployment building its own app sets
# these (here, or with -Ppurrlor.host=app.example.com on the command line); see README.md.
# The package name is permanent once the app is on Google Play.
purrlor.host=purr.meowops.net
purrlor.applicationId=net.meowops.purrlor
purrlor.appName=Purrlor
