# Serves the built SPA, falling back to index.html for client-side routing (react-router-dom).
server {
  listen 80;
  listen [::]:80;

  root /usr/share/nginx/html;

  # CSP, framing, HSTS and friends (security-headers.conf). Repeated in each location below that adds
  # a header of its own: nginx forgets the server's add_header lines in such a location.
  include /etc/nginx/purrlor/security-headers.conf;

  # Text compressed on the way out (a CDN in front may do it too; then this is never seen).
  gzip on;
  gzip_vary on;
  gzip_min_length 1024;
  gzip_types text/css application/javascript application/json application/manifest+json image/svg+xml application/wasm;

  # What a browser (or the desktop app's WebView2, which keeps its cache between runs) may keep:
  # - The build's own files (/assets/) are named by their contents, so one never changes: kept a
  #   year without asking again. One that isn't there is a 404, never index.html, which would
  #   otherwise be kept a year under a script's name.
  # - Everything else (index.html, sw.js, the shim, the manifest) is checked with the server on
  #   each load ("no-cache" keeps it, but revalidates: a 304 when nothing changed), so a deploy is
  #   picked up at once.
  # - Icons rarely change: a week.
  location / {
    try_files $uri $uri/ /index.html;
    include /etc/nginx/purrlor/security-headers.conf;
    add_header Cache-Control "no-cache";
  }

  location /assets/ {
    try_files $uri =404;
    include /etc/nginx/purrlor/security-headers.conf;
    add_header Cache-Control "public, max-age=31536000, immutable";
  }

  location ~ \.(png|ico)$ {
    include /etc/nginx/purrlor/security-headers.conf;
    add_header Cache-Control "public, max-age=604800";
  }

  # Older nginx images don't know the type; browsers want it to install the app.
  location = /manifest.webmanifest {
    types { application/manifest+json webmanifest; }
    include /etc/nginx/purrlor/security-headers.conf;
    add_header Cache-Control "no-cache";
  }

  # The Android app's Digital Asset Links (40-purrlor-config.sh, apps/android/README.md): a 404 when
  # none is set, never index.html, which Android would read as a broken file. Checked again often,
  # since a fingerprint added in .env should reach phones soon.
  location = /.well-known/assetlinks.json {
    try_files $uri =404;
    default_type application/json;
    include /etc/nginx/purrlor/security-headers.conf;
    add_header Cache-Control "public, max-age=3600";
  }

  # Written at container start (40-purrlor-config.sh) and changes whenever .env does — never let a
  # browser keep serving a stale homeserver lock.
  location = /config.json {
    include /etc/nginx/purrlor/security-headers.conf;
    add_header Cache-Control "no-store";
  }
}
